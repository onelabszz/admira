<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TKA Studio — Buat Bank Soal dalam 3 Langkah</title>
  <meta name="description" content="Prompt builder + parser untuk membuat bank soal TKA. Ekspor ke TKA Local Host.">
  <meta name="theme-color" content="#1e40af">

  <!-- Favicon: kotak biru gradient dengan "TKA" putih + dot amber -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e40af'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Inter,system-ui,sans-serif' font-size='22' font-weight='800' text-anchor='middle' fill='white' letter-spacing='-0.5'%3ETKA%3C/text%3E%3Ccircle cx='52' cy='14' r='5' fill='%23fbbf24'/%3E%3C/svg%3E">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">

  <!-- Fonts & CDN preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Harap aktifkan JavaScript untuk menggunakan TKA Studio.</noscript>

  <script>
    (function () {
      var el = document.getElementById('app');
      function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      function show(title, detail) {
        if (!el) return;
        el.innerHTML =
          '<div style="padding:20px;font-family:system-ui,sans-serif;max-width:100%;box-sizing:border-box;">' +
            '<h1 style="color:#DC2626;font-size:18px;margin:0 0 8px;">⚠️ ' + esc(title) + '</h1>' +
            '<p style="color:#64748b;font-size:13px;margin:0 0 12px;">Salin teks di kotak merah di bawah, lalu kirim ke chat.</p>' +
            '<pre style="background:#FEF2F2;color:#7F1D1D;padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;margin:0;border:1px solid #FECACA;">' + esc(detail) + '</pre>' +
          '</div>';
      }
      window.addEventListener('error', function (e) {
        if (e && e.error) show('Uncaught error', e.error.stack || e.error.message || String(e.error));
        else if (e && e.message) show('Script error', e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason) show('Unhandled promise rejection', e.reason.stack || e.reason.message || String(e.reason));
      });
      setTimeout(function () {
        if (el && el.innerHTML.trim() === '') {
          show('Modul tidak termuat',
            'app.js tidak berjalan sama sekali.\n\nKemungkinan:\n' +
            '1. Spck preview tidak mendukung ES module (coba buka di Chrome langsung)\n' +
            '2. Path file salah (index.html harus satu folder dengan app.js)\n' +
            '3. esm.sh diblokir (cek koneksi internet)'
          );
        }
      }, 4000);
    })();
  </script>

  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
